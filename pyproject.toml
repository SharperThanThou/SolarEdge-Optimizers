[project]
name = "solaredge-optimizers"
version = "0.1.0"
description = "Home Assistant integration for per-optimizer SolarEdge data and health"
requires-python = ">=3.13"
license = "Apache-2.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "SIM", "RUF", "PL", "S", "D"]
ignore = ["D203", "D213", "E501", "PLR0913", "PLR2004", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["E402", "UP036"]
"tests/**" = ["S101", "S105", "S106", "D", "PLR2004"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true
